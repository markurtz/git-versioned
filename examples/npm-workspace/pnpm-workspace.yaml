---
# The same packages for pnpm users, plus a catalog entry that pins the library
# for other workspaces; gitversioned.toml lists it as a target.
packages:
  - packages/*
catalog:
  "@demo/core": 0.0.0
# Supply chain: wait 7 days for new versions and refuse untrusted sources.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade
