[build-system]
requires = ["hatchling", "gitversioned>=0.4"]
build-backend = "hatchling.build"

[project]
name = "demo-hatch"
dynamic = ["version"]
description = "A Hatchling project versioned from git tags."
requires-python = ">=3.10"

[tool.hatch.version]
source = "gitversioned"

[tool.hatch.build.hooks.gitversioned]

[tool.hatch.build.targets.wheel]
packages = ["src/demo_hatch"]
