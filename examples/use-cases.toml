#
# Every use case gitversioned is measured against, from four sources:
#
#   v03        what gitversioned 0.3.1 supported (main branch docs and examples)
#   prd        the 0.4 PRD v3: user stories S1 to S14, commands, keys, exit codes
#   template   what the markurtz/template generator (v0.6.1) needs from it
#   competitor what release-please, release-plz, cargo-release, commitizen,
#              changesets, semantic-release, setuptools-scm, uv and the newer
#              polyglot tools offer
#
# Each entry names the examples that show it working (their README transcripts
# are the tests) or, with status = "out-of-scope", the reason it is left out.
# examples/test_manifest.py checks that every named example exists and that
# every entry is one or the other. scripts/generate_examples.py renders this
# file as docs/examples/use-cases.md.

# ==============================================================================
# 0.3.1
# ==============================================================================

[[use-case]]
id = "V1"
source = "v03"
title = "Hatchling version source with a build hook that ships version.py"
examples = ["hatchling", "template-python"]

