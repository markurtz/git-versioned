# pr-title.yml with the gitversioned action instead of pipx: no Python setup,
# and the title goes in as an input, never through the shell.
name: pr-title-action
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: markurtz/git-versioned@v0.4.0
        with:
          command: check
          title: ${{ github.event.pull_request.title }}
