# Every push to main rebuilds release/next and opens or updates the release
# pull request. Exit code 1 means nothing is releasable yet.
name: release-pr
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: release-pr
  cancel-in-progress: true
jobs:
  release-pr:
    if: ${{ !startsWith(github.event.head_commit.message, 'release') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Open or update the release pull request
        run: pipx run gitversioned release --pr || [ $? -eq 1 ]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
