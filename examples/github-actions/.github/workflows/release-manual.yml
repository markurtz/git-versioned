# A release without the pull request: write the changelog and committed targets,
# commit them, then tag that commit. Leave the version empty to take the one
# the commits call for.
name: release-manual
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, or empty for the next one
        required: false
        default: ""
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Write the release
        run: |
          pipx run gitversioned release $VERSION --write
          git add -A
          git commit -qm "release: v$(pipx run gitversioned release $VERSION --json | jq -r .version)"
          git push -q
        env:
          VERSION: ${{ inputs.version }}
      - name: Tag it
        run: pipx run gitversioned release --tag
