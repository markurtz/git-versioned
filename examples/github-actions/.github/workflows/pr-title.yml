# Squash merges turn the pull request title into the commit subject, so checking
# the title keeps every commit on main releasable.
name: pr-title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the title
        run: pipx run gitversioned check "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
