[metadata]
name = legacy-app
description = A setuptools project configured in setup.cfg.

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10

[options.packages.find]
where = src

# Settings for gitversioned live in this table when setup.cfg is the project's
# only configuration file.
[tool:gitversioned]
fallback = 0.0.1
