#
# The index of every example: one [example.<topic>] table per folder under
# examples/. Each topic's README.md is its test: examples/conftest.py runs the
# console transcripts in it. scripts/generate_examples.py builds
# examples/README.md and the docs pages from this file, and
# examples/test_manifest.py checks that the tables, the folders and the use case
# inventory (use-cases.toml) agree.
#
# Keys per example:
#   title, summary  shown in the indexes
#   level           beginner | intermediate | advanced
#   marker          pytest intent marker: smoke | sanity | regression
#   requires        executables the example needs; it is skipped without them
#   gh              true to sign the stand-in GitHub CLI in
#   timeout         seconds per command (default 120)

[example.hatchling]
title = "Hatchling, zero config"
summary = "A Python package whose version comes from git tags at build time, with nothing configured."
level = "beginner"
marker = "smoke"

[example.setuptools]
title = "setuptools from pyproject.toml"
summary = "A setuptools package versioned from tags, with settings and scopes in `pyproject.toml`."
level = "beginner"
marker = "smoke"

[example.setuptools-legacy]
title = "setuptools from setup.cfg and setup.py"
summary = "Older setuptools layouts: settings in `setup.cfg` and a `setup.py` that only calls `setup()`."
level = "beginner"
marker = "sanity"

[example.static-version]
title = "Static versions for uv_build and other backends"
summary = "Backends that read a static version, such as uv_build, get it stamped into `pyproject.toml` before the build."
level = "intermediate"
marker = "sanity"
requires = ["uv"]
timeout = 600

[example.version-shapes]
title = "Every version shape"
summary = "Release, dev, dirty, nightly and pre-release versions in PEP 440 and SemVer, with the settings and variables that shape them."
level = "beginner"
marker = "smoke"

[example.next-version]
title = "The next version and why"
summary = "Bump levels from Conventional Commits, with `--explain`, `--bump`, `--pre` and every override."
level = "intermediate"
marker = "sanity"

[example.commit-checks]
title = "Pull request titles and commit messages"
summary = "`check` validates titles, commit ranges and commit-msg hook files against the allowed types and scopes."
level = "beginner"
marker = "smoke"

[example.ci-safety]
title = "No silent wrong versions in CI"
summary = "Shallow clones, missing tags and tarball downloads: warnings on a laptop, failures in CI, and the archive file that fixes tarballs."
level = "intermediate"
marker = "sanity"

[example.release-local]
title = "Releasing from a terminal"
summary = "Plan a release, write the changelog, commit and tag it by hand, with the same checks a workflow runs."
