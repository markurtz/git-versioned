marker = "sanity"

[example.release-pr]
title = "The release pull request"
summary = "`release --pr` keeps `release/next` and its pull request up to date, labels make release candidates, and `release --tag` tags the merge."
level = "advanced"
marker = "sanity"
gh = true

[example.configuration]
title = "Settings, homes and the environment"
